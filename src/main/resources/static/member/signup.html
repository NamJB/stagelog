<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>StageLog 회원가입</h1>
<form id = "signupForm">
    <label for = "loginId">아이디</label>
    <input id = "loginId" type = "text" required>

    <label for = "password">비밀번호</label>
    <input id = "password" type = "password" required>

    <label for = "email">이메일</label>
    <input id = "email" type = "email" required>

    <label for = "name">이름</label>
    <input id = "name" type = "text" required>

    <label for = "birthDate">생년월일</label>
    <input id = "birthDate" type = "date" required>

    <button id = "sighupButton" type = "submit">가입하기</button>
</form>
<p id="signupMessage"></p>





<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $("#signupForm").on("submit",function(event){

        event.preventDefault();

        const signupData = {
            loginId: $("#loginId").val(),
            password : $("#password").val(),
            email : $("#email").val(),
            name : $("#name").val(),
            birthDate : $("#birthDate").val()
        };

        $.ajax({
            url : "/api/member/signup",
            method : "POST",
            contentType : "application/json",
            data : JSON.stringify(signupData),
            success : function() {
                window.location.href = "/member/login.html";
            },
            error:function (xhr) {

                const response = xhr.responseJSON;

                const messages = Object.values(response?.error ?? {});

                const message = messages.join("/")||response?.message||"가입에 실패햇습니다";

                $("#signupMessage").text(message);
            }


        });

    })

</script>


</body>
</html>
